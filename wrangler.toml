name = "sp-dash-2"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[services]]
binding = "SSO"
service = "sso-api"
entrypoint = "SsoWorker"

[env.production.vars]
NEXT_PUBLIC_BASE_URL = "https://dashboard.rareminds.com"

[[env.production.services]]
binding = "SSO"
service = "sso-api"
entrypoint = "SsoWorker"

[env.staging.vars]
NEXT_PUBLIC_BASE_URL = "https://dashboard-staging.rareminds.com"

[[env.staging.services]]
binding = "SSO"
service = "sso-api"
entrypoint = "SsoWorker"

[env.development.vars]
NEXT_PUBLIC_BASE_URL = "http://localhost:3000"

[[env.development.services]]
binding = "SSO"
service = "sso-api"
entrypoint = "SsoWorker"