# ============================================================================
# QA: same database as dev, separate Worker/services/queues/storage/rate limits.
# Create course-management-uploads-qa and lte-asset-validation-qa if missing.
# Ensure lte-qa and skill-echosystem-qa R2 buckets exist.
# RATE_LIMIT_KV below currently shares the dev namespace; use a separate ID for isolated QA limits.
# Add the same database credentials as dev as secrets with --env qa;
# use the QA LTE_INTERNAL_SECRET and QA COURSE_UPLOAD_WORKER_TOKEN.
# Secrets are not inherited from dev. Do not deploy until placeholders are replaced.
# ============================================================================

