main = "workers/sp-dash-worker.js"
name = "sp-dash-2"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[vars]
LTE_SUPABASE_URL = "https://jsifqriqlvkpedtoywsk.supabase.co"
NEXT_PUBLIC_SUPABASE_URL = "https://dpooleduinyyzxgrcwko.supabase.co"
SKILLPASSPORT_SUPABASE_URL = "https://dpooleduinyyzxgrcwko.supabase.co"
SSO_WORKER_URL = "https://sso-api.dark-mode-d021.workers.dev"

# ============================================================================
# CRITICAL: MISSING SECRETS - These must be added as Cloudflare secrets!
# ============================================================================
# Run these commands to add the secrets:
#   wrangler secret put LTE_SERVICE_ROLE_KEY
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put NEXT_PUBLIC_SUPABASE_ANON_KEY
#   wrangler secret put SKILLPASSPORT_SERVICE_ROLE_KEY (optional, falls back to SUPABASE_SERVICE_ROLE_KEY)
# ============================================================================

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "SSO"
service = "sso-api"
entrypoint = "SsoWorker"

# Self-reference service binding, required by OpenNext for cache revalidation.
# The service name must match `name` above.
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "sp-dash-2"

[[queues.producers]]
binding = "MAINTENANCE_EVENTS_QUEUE"
queue = "realtime-events-queue"

[[queues.producers]]
binding = "LTE_ASSET_VALIDATION_QUEUE"
queue = "lte-asset-validation"

[[queues.consumers]]
queue = "lte-asset-validation"
max_batch_size = 2
max_batch_timeout = 1
max_concurrency = 10
max_retries = 3

# Rate limiting KV namespace
# Create with: wrangler kv namespace create RATE_LIMIT_KV
# Then paste the ID below
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "a162f140e4464515a8d5a27b5ebc6c6b"

[[r2_buckets]]
binding = "LTE_ASSETS"
bucket_name = "lte"

[[r2_buckets]]
binding = "COURSE_ASSETS"
bucket_name = "course-assets"

[env.dev]
name = "sp-dash-2"
compatibility_date = "2026-09-24"
workers_dev = true
preview_urls = true

[env.dev.vars]
LTE_SUPABASE_URL = "https://yydcuumoerqjfuakhslj.supabase.co"
NEXT_PUBLIC_SUPABASE_URL = "https://qjdmndjtibajwswufghf.supabase.co"
SKILLPASSPORT_SUPABASE_URL = "https://qjdmndjtibajwswufghf.supabase.co"
SSO_WORKER_URL = "https://sso-api-dev.subashini.workers.dev"

[[env.dev.services]]
binding = "SSO"
service = "sso-api-dev"
entrypoint = "SsoWorker"

[[env.dev.services]]
binding = "WORKER_SELF_REFERENCE"
service = "sp-dash-2"

[[env.dev.queues.producers]]
binding = "MAINTENANCE_EVENTS_QUEUE"
queue = "realtime-events-queue-dev"

[[env.dev.queues.producers]]
binding = "LTE_ASSET_VALIDATION_QUEUE"
queue = "lte-asset-validation-dev"

[[env.dev.queues.consumers]]
queue = "lte-asset-validation-dev"
max_batch_size = 2
max_batch_timeout = 1
max_concurrency = 5
max_retries = 3

[[env.dev.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "00dd9c44924f413ca859ba9ad80b8aa7"

[[env.dev.r2_buckets]]
binding = "LTE_ASSETS"
bucket_name = "lte-dev"

[[env.dev.r2_buckets]]
binding = "COURSE_ASSETS"
bucket_name = "course-assets-dev"
