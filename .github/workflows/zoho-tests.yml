name: Zoho control plane tests
on:
  pull_request:
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  zoho:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:zoho
      - run: npm run test:zoho-ui
      - run: npm run test:zoho-scripts
